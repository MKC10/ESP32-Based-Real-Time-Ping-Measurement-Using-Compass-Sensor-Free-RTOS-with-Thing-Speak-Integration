<svg width="100%" viewBox="0 0 680 480" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.t { font-family: sans-serif; font-size: 14px; fill: #3d3d3a; }
.ts { font-family: sans-serif; font-size: 12px; fill: #73726c; }
.th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #3d3d3a; }
.arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple text { fill: #3C3489; }
.c-blue rect { fill: #E6F1FB; stroke: #378ADD; }
.c-blue text { fill: #0C447C; }
.c-teal rect { fill: #E1F5EE; stroke: #1D9E75; }
.c-teal text { fill: #085041; }
.c-amber rect { fill: #FAEEDA; stroke: #BA7517; }
.c-amber text { fill: #633806; }
.c-green rect { fill: #EAF3DE; stroke: #639922; }
.c-green text { fill: #27500A; }
</style>
</defs>

<!-- ESP32 Container -->
<g class="c-purple">
<rect x="40" y="40" width="600" height="240" rx="20" stroke-width="0.5"/>
<text class="th" x="340" y="72" text-anchor="middle">ESP32 Dual-Core Microcontroller</text>
</g>

<!-- Core 0 -->
<g class="c-blue">
<rect x="80" y="100" width="240" height="160" rx="12" stroke-width="0.5"/>
<text class="th" x="200" y="130" text-anchor="middle">Core 0</text>
<text class="ts" x="200" y="150" text-anchor="middle">WiFi Stack (Espressif managed)</text>
<text class="ts" x="200" y="180" text-anchor="middle">• Network processing</text>
<text class="ts" x="200" y="200" text-anchor="middle">• ICMP ping handler</text>
<text class="ts" x="200" y="220" text-anchor="middle">• ThingSpeak upload</text>
</g>

<!-- Core 1 -->
<g class="c-teal">
<rect x="360" y="100" width="240" height="160" rx="12" stroke-width="0.5"/>
<text class="th" x="480" y="130" text-anchor="middle">Core 1</text>
<text class="ts" x="480" y="150" text-anchor="middle">FreeRTOS Scheduler</text>
<text class="ts" x="480" y="180" text-anchor="middle">• User tasks</text>
<text class="ts" x="480" y="200" text-anchor="middle">• Sensor reading</text>
<text class="ts" x="480" y="220" text-anchor="middle">• Data processing</text>
</g>

<!-- WiFi Network Box -->
<g class="c-amber">
<rect x="80" y="320" width="200" height="120" rx="12" stroke-width="0.5"/>
<text class="th" x="180" y="355" text-anchor="middle">WiFi Network</text>
<text class="ts" x="180" y="375" text-anchor="middle">• Ping target: google.com</text>
<text class="ts" x="180" y="395" text-anchor="middle">• ThingSpeak cloud</text>
<text class="ts" x="180" y="415" text-anchor="middle">• 802.11 b/g/n</text>
</g>

<!-- I2C Sensors Box -->
<g class="c-green">
<rect x="400" y="320" width="200" height="120" rx="12" stroke-width="0.5"/>
<text class="th" x="500" y="355" text-anchor="middle">I2C Sensors</text>
<text class="ts" x="500" y="375" text-anchor="middle">• QMC5883L compass</text>
<text class="ts" x="500" y="395" text-anchor="middle">• SDA: GPIO 25</text>
<text class="ts" x="500" y="415" text-anchor="middle">• SCL: GPIO 26</text>
</g>

<!-- Arrows -->
<line x1="200" y1="280" x2="200" y2="318" class="arr" marker-end="url(#arrow)"/>
<line x1="480" y1="280" x2="480" y2="318" class="arr" marker-end="url(#arrow)"/>

</svg>