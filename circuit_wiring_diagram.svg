<svg width="100%" viewBox="0 0 680 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<style>
.t { font-family: sans-serif; font-size: 14px; fill: #3d3d3a; }
.ts { font-family: sans-serif; font-size: 12px; fill: #73726c; }
.th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #3d3d3a; }
.c-blue rect { fill: #E6F1FB; stroke: #378ADD; }
.c-blue text { fill: #0C447C; }
.c-teal rect { fill: #E1F5EE; stroke: #1D9E75; }
.c-teal text { fill: #085041; }
.c-gray rect { fill: #F1EFE8; stroke: #5F5E5A; }
.c-gray text { fill: #2C2C2A; }
</style>
</defs>

<!-- Title -->
<text class="th" x="340" y="30" text-anchor="middle">ESP32 ↔ QMC5883L Connection Diagram</text>

<!-- ESP32 Board -->
<g class="c-blue">
<rect x="60" y="80" width="200" height="260" rx="12" stroke-width="0.5"/>
<text class="th" x="160" y="110" text-anchor="middle">ESP32 DevKit</text>
</g>

<!-- ESP32 Pins -->
<g class="c-gray">
<rect x="70" y="140" width="180" height="30" rx="4" stroke-width="0.5"/>
<text class="ts" x="80" y="160" text-anchor="start">GPIO 25 (SDA)</text>
<circle cx="240" cy="155" r="4" fill="#378ADD"/>
</g>

<g class="c-gray">
<rect x="70" y="180" width="180" height="30" rx="4" stroke-width="0.5"/>
<text class="ts" x="80" y="200" text-anchor="start">GPIO 26 (SCL)</text>
<circle cx="240" cy="195" r="4" fill="#1D9E75"/>
</g>

<g class="c-gray">
<rect x="70" y="220" width="180" height="30" rx="4" stroke-width="0.5"/>
<text class="ts" x="80" y="240" text-anchor="start">3.3V (VCC)</text>
<circle cx="240" cy="235" r="4" fill="#E24B4A"/>
</g>

<g class="c-gray">
<rect x="70" y="260" width="180" height="30" rx="4" stroke-width="0.5"/>
<text class="ts" x="80" y="280" text-anchor="start">GND</text>
<circle cx="240" cy="275" r="4" fill="#3d3d3a"/>
</g>

<!-- QMC5883L Compass -->
<g class="c-teal">
<rect x="420" y="80" width="200" height="260" rx="12" stroke-width="0.5"/>
<text class="th" x="520" y="110" text-anchor="middle">QMC5883L Compass</text>
</g>

<!-- Compass Pins -->
<g class="c-gray">
<rect x="430" y="140" width="180" height="30" rx="4" stroke-width="0.5"/>
<circle cx="440" cy="155" r="4" fill="#378ADD"/>
<text class="ts" x="600" y="160" text-anchor="end">SDA</text>
</g>

<g class="c-gray">
<rect x="430" y="180" width="180" height="30" rx="4" stroke-width="0.5"/>
<circle cx="440" cy="195" r="4" fill="#1D9E75"/>
<text class="ts" x="600" y="200" text-anchor="end">SCL</text>
</g>

<g class="c-gray">
<rect x="430" y="220" width="180" height="30" rx="4" stroke-width="0.5"/>
<circle cx="440" cy="235" r="4" fill="#E24B4A"/>
<text class="ts" x="600" y="240" text-anchor="end">VCC</text>
</g>

<g class="c-gray">
<rect x="430" y="260" width="180" height="30" rx="4" stroke-width="0.5"/>
<circle cx="440" cy="275" r="4" fill="#3d3d3a"/>
<text class="ts" x="600" y="280" text-anchor="end">GND</text>
</g>

<!-- Connection Lines -->
<!-- SDA -->
<path d="M 244 155 L 320 155 L 320 155 L 436 155" fill="none" stroke="#378ADD" stroke-width="2"/>

<!-- SCL -->
<path d="M 244 195 L 310 195 L 310 195 L 436 195" fill="none" stroke="#1D9E75" stroke-width="2"/>

<!-- VCC -->
<path d="M 244 235 L 300 235 L 300 235 L 436 235" fill="none" stroke="#E24B4A" stroke-width="2"/>

<!-- GND -->
<path d="M 244 275 L 290 275 L 290 275 L 436 275" fill="none" stroke="#3d3d3a" stroke-width="2"/>

<!-- Labels on wires -->
<text class="ts" x="340" y="150" text-anchor="middle" fill="#378ADD">Data</text>
<text class="ts" x="340" y="190" text-anchor="middle" fill="#1D9E75">Clock</text>
<text class="ts" x="340" y="230" text-anchor="middle" fill="#E24B4A">Power</text>
<text class="ts" x="340" y="270" text-anchor="middle">Ground</text>

<!-- Notes -->
<text class="ts" x="340" y="365" text-anchor="middle">I2C Protocol: Two-wire serial communication</text>

</svg>