<svg width="100%" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg">
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
<style>
.t { font-family: sans-serif; font-size: 14px; fill: #3d3d3a; }
.ts { font-family: sans-serif; font-size: 12px; fill: #73726c; }
.th { font-family: sans-serif; font-size: 14px; font-weight: 500; fill: #3d3d3a; }
.arr { stroke: #73726c; stroke-width: 1.5; fill: none; }
.c-blue rect { fill: #E6F1FB; stroke: #378ADD; }
.c-blue text { fill: #0C447C; }
.c-teal rect { fill: #E1F5EE; stroke: #1D9E75; }
.c-teal text { fill: #085041; }
.c-amber rect { fill: #FAEEDA; stroke: #BA7517; }
.c-amber text { fill: #633806; }
.c-coral rect { fill: #FAECE7; stroke: #D85A30; }
.c-coral text { fill: #712B13; }
.c-purple rect { fill: #EEEDFE; stroke: #534AB7; }
.c-purple text { fill: #3C3489; }
.c-green rect { fill: #EAF3DE; stroke: #639922; }
.c-green text { fill: #27500A; }
</style>
</defs>

<!-- Title -->
<text class="th" x="340" y="30" text-anchor="middle">FreeRTOS Task Architecture</text>

<!-- Task 1: pingTask -->
<g class="c-blue">
<rect x="40" y="70" width="180" height="120" rx="12" stroke-width="0.5"/>
<text class="th" x="130" y="100" text-anchor="middle">Task 1: pingTask</text>
<text class="ts" x="130" y="125" text-anchor="middle">Priority: 1</text>
<text class="ts" x="130" y="145" text-anchor="middle">Stack: 2048 bytes</text>
<text class="ts" x="130" y="165" text-anchor="middle">Period: 3 seconds</text>
</g>

<!-- Task 2: CompTask -->
<g class="c-teal">
<rect x="250" y="70" width="180" height="120" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="100" text-anchor="middle">Task 2: CompTask</text>
<text class="ts" x="340" y="125" text-anchor="middle">Priority: 1</text>
<text class="ts" x="340" y="145" text-anchor="middle">Stack: 2048 bytes</text>
<text class="ts" x="340" y="165" text-anchor="middle">Period: 3 seconds</text>
</g>

<!-- Task 3: thingSpeakTask -->
<g class="c-amber">
<rect x="460" y="70" width="180" height="120" rx="12" stroke-width="0.5"/>
<text class="th" x="550" y="100" text-anchor="middle">Task 3: ThingSpeak</text>
<text class="ts" x="550" y="125" text-anchor="middle">Priority: 1</text>
<text class="ts" x="550" y="145" text-anchor="middle">Stack: 2048 bytes</text>
<text class="ts" x="550" y="165" text-anchor="middle">Period: 30 seconds</text>
</g>

<!-- Semaphore -->
<g class="c-coral">
<rect x="240" y="260" width="200" height="80" rx="12" stroke-width="0.5"/>
<text class="th" x="340" y="290" text-anchor="middle">Binary Semaphore</text>
<text class="ts" x="340" y="315" text-anchor="middle">Protects shared data</text>
</g>

<!-- Arrows from tasks to semaphore -->
<line x1="130" y1="190" x2="290" y2="258" class="arr" marker-end="url(#arrow)"/>
<line x1="340" y1="190" x2="340" y2="258" class="arr" marker-end="url(#arrow)"/>
<line x1="550" y1="190" x2="390" y2="258" class="arr" marker-end="url(#arrow)"/>

<!-- Shared Data -->
<g class="c-purple">
<rect x="40" y="400" width="280" height="80" rx="12" stroke-width="0.5"/>
<text class="th" x="180" y="430" text-anchor="middle">Shared Data</text>
<text class="ts" x="180" y="455" text-anchor="middle">avg_time_ms, CompassData struct</text>
</g>

<!-- Arrow from semaphore to shared data -->
<line x1="340" y1="340" x2="180" y2="398" class="arr" marker-end="url(#arrow)"/>

<!-- FreeRTOS Scheduler -->
<g class="c-green">
<rect x="360" y="400" width="280" height="80" rx="12" stroke-width="0.5"/>
<text class="th" x="500" y="430" text-anchor="middle">FreeRTOS Scheduler</text>
<text class="ts" x="500" y="455" text-anchor="middle">Round-robin, time-slice: 1ms</text>
</g>

</svg>